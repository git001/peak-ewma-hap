# Load balancer: the same servers behind several algorithms, one port each.
# The entrypoint replaces the @SERVERS@ lines with BE_COUNT servers be-<i>.
#
#   :8080  balance random(2)              power of two choices on sessions
#   :8081  random(2) + Lua Peak EWMA      power of two choices on latency*load
#   :8082  balance leastconn
#   :8083  Lua Peak EWMA over all servers (no random draws)
#   :8084  Lua Peak EWMA with three random draws
#   :8085  balance random(2) peak-ewma    core implementation, 2 draws
#   :8086  balance random(3) peak-ewma    core implementation, 3 draws
#   :8087  balance random(2) peak-ewma, weight 100 (even hash ring)
#   :8088  balance random(3) peak-ewma, weight 100 (even hash ring)
#          (8085-8088 need an HAProxy built from the peak-ewma branch)
#   :8404  /stats (CSV with /stats;csv) and /metrics

global
    nbthread "${NBTHREAD}"
    maxconn 20000
    tune.lua.bool-sample-conversion normal
    lua-load-per-thread /etc/haproxy/peak_ewma.lua
    stats socket /var/run/haproxy/lb.sock mode 600 level admin
    # read only, for "show stat" from the bench job
    stats socket ipv4@0.0.0.0:9100 level user

# in Kubernetes the servers are pod names that may not resolve yet at start
resolvers dns
    parse-resolv-conf
    hold valid 10s

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 30s
    default-server check inter 1s fall 2 rise 2 resolvers dns init-addr last,libc,none

frontend fe_random
    bind :8080
    default_backend be_random

frontend fe_pewma
    bind :8081
    default_backend be_pewma

frontend fe_leastconn
    bind :8082
    default_backend be_leastconn

frontend fe_pewmafull
    bind :8083
    default_backend be_pewmafull

frontend fe_pewma3
    bind :8084
    default_backend be_pewma3

frontend fe_core2
    bind :8085
    default_backend be_core2

frontend fe_core3
    bind :8086
    default_backend be_core3

frontend fe_core2w
    bind :8087
    default_backend be_core2w

frontend fe_core3w
    bind :8088
    default_backend be_core3w

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

backend be_random
    balance random(2)
    # @SERVERS@

backend be_pewma
    # random(2) stays the fallback when no server was picked or the
    # picked server went down in the meantime
    balance random(2)
    http-request lua.peak_ewma_pick be_pewma 2
    use-server %[var(txn.pe_pick)] if { var(txn.pe_pick) -m found }
    http-after-response lua.peak_ewma_record
    # @SERVERS@

backend be_leastconn
    balance leastconn
    # @SERVERS@

backend be_pewmafull
    # same cost as be_pewma, but compared over all the servers
    balance random(2)
    http-request lua.peak_ewma_pick be_pewmafull 0
    use-server %[var(txn.pe_pick)] if { var(txn.pe_pick) -m found }
    http-after-response lua.peak_ewma_record
    # @SERVERS@

backend be_pewma3
    # same cost as be_pewma, three distinct random candidates
    balance random(2)
    http-request lua.peak_ewma_pick be_pewma3 3
    use-server %[var(txn.pe_pick)] if { var(txn.pe_pick) -m found }
    http-after-response lua.peak_ewma_record
    # @SERVERS@

backend be_core2
    balance random(2) peak-ewma
    # @SERVERS@

backend be_core3
    balance random(3) peak-ewma
    # @SERVERS@

# random() draws on the consistent hash ring, where a server has 16 points
# per unit of weight: with weight 1 the shares of the servers vary by 2x,
# with weight 100 (1600 points) they are almost even
backend be_core2w
    balance random(2) peak-ewma
    default-server weight 100
    # @SERVERS@

backend be_core3w
    balance random(3) peak-ewma
    default-server weight 100
    # @SERVERS@
