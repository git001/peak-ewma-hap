# Shim in front of one haterm: haterm takes the response size (s) and the
# delay (t) from the query string only, so the shim sets them for every
# request. The delay can be changed at runtime over the CLI:
#
#   echo "experimental-mode on; set var proc.delay str(200)" | \
#       socat stdio tcp:<shim>:<SHIM_CLI_PORT>

global
    nbthread "${NBTHREAD}"
    maxconn 5000
    stats socket /var/run/haproxy/shim.sock mode 600 level admin
    # test setup only: admin CLI over TCP to change the delay from outside
    stats socket "ipv4@0.0.0.0:${SHIM_CLI_PORT}" level admin
    set-var-fmt proc.delay "${DELAY}"
    set-var-fmt proc.size "${SIZE}"

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 30s

frontend shim
    bind ":${SHIM_PORT}"
    http-request set-query "s=%[var(proc.size)]&t=%[var(proc.delay)]"
    default_backend haterm

backend haterm
    server haterm "${HATERM_ADDR}"
